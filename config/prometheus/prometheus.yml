global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'docker-local'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          app: 'prometheus'
          tier: 'monitoring'

  - job_name: 'users-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['users:8080']
        labels:
          app: 'users-api'
          tier: 'application'
          language: 'dotnet'
          framework: 'aspnetcore'

  - job_name: 'catalog-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['catalog:8080']
        labels:
          app: 'catalog-api'
          tier: 'application'
          language: 'dotnet'
          framework: 'aspnetcore'
