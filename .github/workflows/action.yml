name: Pipeline Infra

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
          AWS_REGION: ${{vars.AWS_REGION}}
          CLUSTER_NAME: ${{vars.CLUSTER_NAME}}
          NAMESPACE: fcg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{env.AWS_REGION}}
      
      - name: Testar Conexão AWS
        run: |
          aws sts get-caller-identity

      - name: Conectar no cluster
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - name: Testar Conexão com o Cluster
        run: |
          kubectl get nodes
          kubectl get pods -A

      - name: Criando namespace no Cluster
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicando storageclass
        run: |
          kubectl apply -f ./k8s/storageclass.yaml

      - name: Aplicando rabbitmq
        run: |
          echo "Aplicando rabbitmq"
          kubectl create secret generic rabbitmq-secret -n ${{ env.NAMESPACE }} \
            --from-literal=rabbitmq-username=${{secrets.RABBITMQ_USERNAME}} \
            --from-literal=rabbitmq-password=${{ secrets.RABBITMQ_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f ./k8s/rabbitmq/configmap.yaml
          kubectl apply -f ./k8s/rabbitmq/deployment.yaml
          kubectl apply -f ./k8s/rabbitmq/service.yaml
          echo "Aguardando rabbitmq ficar disponivel"
          kubectl rollout status \
          deployment/rabbitmq \
          --timeout=120s
          echo "Rabbitmq ficou disponivel"
      - name: Aplicando postgres
        run: |
          echo "Aplicando postgres da aplicação"
          kubectl create secret generic ostgres-secret -n ${{ env.NAMESPACE }} \
            --from-literal=postgres-username=${{secrets.POSTGRES_USERNAME}} \
            --from-literal=postgres-password=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=connection-string-users="${{ secrets.POSTGRES_CONNECTION_USER }}" \
            --from-literal=connection-string-catalog="${{ secrets.POSTGRES_CONNECTION_CATALOG }}" \
            --from-literal=connection-string-payments="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f ./k8s/rabbitmq/configmap.yaml
          kubectl apply -f ./k8s/rabbitmq/deployment.yaml
          kubectl apply -f ./k8s/rabbitmq/service.yaml
          echo "Aguardando postgres ficar disponivel"
          kubectl rollout status \
          deployment/postgres \
          --timeout=120s
          echo "Postgres ficou disponivel"
          