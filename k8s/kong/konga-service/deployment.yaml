apiVersion: apps/v1
kind: Deployment
metadata:
  name: konga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: konga
  template:
    metadata:
      labels:
        app: konga
    spec:
      containers:
        - name: konga
          image: pantsel/konga:latest
          ports:
            - name: http
              containerPort: 1337
              protocol: TCP

          env:
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: kong-secrets
                  key: KONGA_TOKEN_SECRET

            - name: DB_ADAPTER
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_DATABASE

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_DB_PORT

            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONGA_DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-secrets
                  key: KONG_DB_PASSWORD

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONGA_ENV