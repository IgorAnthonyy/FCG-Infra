apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  postgres-username: fcg_user
  postgres-password: fcg_password
  connection-string-library: Host=postgres;Database=library;Username=fcg_user;Password=fcg_password
  connection-string-users: Host=postgres;Database=users;Username=fcg_user;Password=fcg_password
  connection-string-catalog: Host=postgres;Database=catalog;Username=fcg_user;Password=fcg_password
  connection-string-payments: Host=postgres;Database=payments;Username=fcg_user;Password=fcg_password
